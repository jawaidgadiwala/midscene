name: Deploy docs site to GitHub Pages

# Publishes apps/fork-docs to https://<owner>.github.io/<repo>/ so fork-only
# docs (the claude:// and codex:// provider pages and the agent skill) have real
# URLs. Deliberately not the whole upstream site — republishing ByteDance's
# documentation under this name would duplicate their canonical docs.
on:
  push:
    branches: [main]
    paths:
      - 'apps/fork-docs/**'
      - 'apps/site/docs/en/model-claude-cli.mdx'
      - 'apps/site/docs/en/model-codex-cli.mdx'
      - 'skills/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The site has no workspace dependencies, so the heavy root build that
      # `prepare` triggers is not needed.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build site
        env:
          # Project pages are served from /<repo>/, not the domain root.
          SITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm --filter fork-docs build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/fork-docs/doc_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
